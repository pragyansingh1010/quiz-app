<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        #quiz {
            width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid black;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            cursor: pointer;
        }

        .correct {
            background-color: lightgreen;
        }

        .wrong {
            background-color: lightcoral;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="quiz">
        <h2 id="question"></h2>

        <div id="options"></div>

        <button onclick="nextQuestion()">Next Question</button>

        <p id="result"></p>
    </div>

    <script>
        let questions = [
            {
                question: "Which language is used to structure a webpage?",
                options: ["HTML", "CSS", "JavaScript", "Python"],
                answer: "HTML"
            },
            {
                question: "Which language is used for styling webpages?",
                options: ["HTML", "CSS", "Java", "Python"],
                answer: "CSS"
            },
            {
                question: "Which language is used to add interactivity?",
                options: ["HTML", "CSS", "JavaScript", "SQL"],
                answer: "JavaScript"
            },
            {
                question: "Which keyword is used to declare a variable in JavaScript?",
                options: ["var", "int", "string", "define"],
                answer: "var"
            },
            {
                question: "Which tag is used to create a paragraph?",
                options: ["<p>", "<h1>", "<br>", "<div>"],
                answer: "<p>"
            }
        ];

        let index = 0;
        let score = 0;
        let selected = false;

        function showQuestion() {
            selected = false;

            document.getElementById("question").innerHTML =
                questions[index].question;

            let options = "";

            for (let i = 0; i < questions[index].options.length; i++) {
                options +=
                    "<button onclick=\"checkAnswer(this)\">" +
                    questions[index].options[i] +
                    "</button><br>";
            }

            document.getElementById("options").innerHTML = options;
            document.getElementById("result").innerHTML =
                "Question " + (index + 1) + " of " + questions.length;
        }

        function checkAnswer(button) {
            if (selected) {
                return;
            }

            selected = true;

            if (button.innerHTML == questions[index].answer) {
                button.classList.add("correct");
                score++;
                document.getElementById("result").innerHTML = "Correct!";
            }
            else {
                button.classList.add("wrong");
                document.getElementById("result").innerHTML =
                    "Wrong! Correct answer: " + questions[index].answer;
            }
        }

        function nextQuestion() {
            if (!selected) {
                document.getElementById("result").innerHTML =
                    "Please select an answer.";
                return;
            }

            index++;

            if (index < questions.length) {
                showQuestion();
            }
            else {
                document.getElementById("quiz").innerHTML =
                    "<h2>Quiz Completed!</h2>" +
                    "<p id='result'>Your Score: " +
                    score + " / " + questions.length + "</p>" +
                    "<button onclick='location.reload()'>Restart Quiz</button>";
            }
        }

        showQuestion();
    </script>

</body>
</html>
